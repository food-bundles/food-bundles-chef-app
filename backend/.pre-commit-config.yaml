# The repository's pre-commit config. Paths are relative to the Git root
# (food-bundles-chef-app/), where hooks run. Install once from the Git root:
#   pre-commit install --config backend/.pre-commit-config.yaml
# The secret scan needs the gitleaks binary (v8.21+) on PATH:
#   Windows: scoop install gitleaks    macOS: brew install gitleaks
# If it is missing, the hook fails and the commit is blocked (fail closed).
repos:
  # ── Secrets: block keys, tokens and private keys anywhere in the repo ──────
  # Rules: .gitleaks.toml (gitleaks defaults + Anthropic/Meta/env-file keys).
  # A local hook, not the upstream one: the upstream hook builds gitleaks from Go
  # source and pre-commit then downloads a Go toolchain, which fails offline.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        language: system
        entry: gitleaks git --pre-commit --staged --redact --verbose --config .gitleaks.toml
        pass_filenames: false
        always_run: true

  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^backend/
      - id: end-of-file-fixer
        files: ^backend/
      - id: check-yaml
        files: ^backend/
      - id: check-toml
        files: ^backend/
      - id: check-json
        files: ^backend/
      - id: check-merge-conflict
        files: ^backend/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        files: ^backend/
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # ── Ruff: lint + format ─────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Bandit: security static analysis ───────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, backend/pyproject.toml]
        files: ^backend/app/
        additional_dependencies: ["bandit[toml]"]

  # ── Mypy: type checking ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--config-file=backend/pyproject.toml]
        files: ^backend/app/
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - sqlalchemy[mypy]
          - fastapi
          - types-passlib
          - types-python-jose
