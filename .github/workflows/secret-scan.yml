# Fails the build when a secret is committed anywhere in the pushed history.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every pushed commit is scanned

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Findings are redacted in the log. Exit code 1 fails the job.
      # Until the history purge in docs/security/secret-history-purge.md is done,
      # the known leak in 41c7efc is listed in .gitleaksignore (the key is rotated).
      - name: Scan
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
